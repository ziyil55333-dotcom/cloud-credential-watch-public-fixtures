name: Publish v19 synthetic articles on GitHub Pages
on:
  push:
    branches: [codex-blind-20261128-v19-rss-job]
    paths: ['.github/workflows/ccw-v19-rss.yml']
permissions:
  contents: write
  pages: write
concurrency: ccw-v19-rss-publisher
jobs:
  publish:
    if: github.repository == 'ziyil55333-dotcom/cloud-credential-watch-public-fixtures' && github.actor == 'ziyil55333-dotcom'
    runs-on: ubuntu-latest
    timeout-minutes: 175
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Publish only the dedicated RSS directory
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != 'ziyil55333-dotcom/cloud-credential-watch-public-fixtures' ]]; then exit 1; fi
          gate=https://clicks-singer-passes-auction.trycloudflare.com/publisher/v19
          site="https://ziyil55333-dotcom.github.io/cloud-credential-watch-public-fixtures/v19-blind-rss"
          dir=v19-blind-rss
          fixtures="$RUNNER_TEMP/ccw-articles.zip"
          git fetch origin main
          git switch --detach FETCH_HEAD
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git rev-parse HEAD)" = a407a25e1015d1adf7fa6c7210d79c0eff863083
          test -s "$dir/feed.xml"
          next_build=0
          publish() {
            local number="$1" ref="$2" page="$3"
            python - "$dir/feed.xml" "$site" "$ref" "$page" <<'PY'
          import sys
          from pathlib import Path
          from xml.etree import ElementTree as ET
          destination, site, guid, page = sys.argv[1:]
          path = Path(destination)
          if path.exists():
              root = ET.parse(path).getroot()
              channel = root.find('channel')
          else:
              root = ET.Element('rss', version='2.0')
              channel = ET.SubElement(root, 'channel')
              ET.SubElement(channel, 'title').text = 'Cloud Credential Watch project synthetic fixture feed'
              ET.SubElement(channel, 'link').text = site + '/feed.xml'
              ET.SubElement(channel, 'description').text = 'Dedicated synthetic evaluation releases'
          item = ET.SubElement(channel, 'item')
          ET.SubElement(item, 'title').text = 'Synthetic fixture ' + guid
          ET.SubElement(item, 'link').text = site + '/' + page
          ET.SubElement(item, 'guid', isPermaLink='false').text = guid
          ET.indent(root)
          ET.ElementTree(root).write(path, encoding='utf-8', xml_declaration=True)
          PY
            git add -- "$dir/$page" "$dir/feed.xml"
            git commit --quiet -m "Publish synthetic v19 article release $number"
            local push_log="$RUNNER_TEMP/ccw-v19-article-push.log"
            blocked=false
            if ! git push origin HEAD:refs/heads/main >"$push_log" 2>&1; then
              if grep -q 'GH013' "$push_log" && grep -qi 'push protection' "$push_log"; then
                echo "Blocked by GitHub push protection: article-$number"
                git switch --detach HEAD^
                blocked=true
                return 0
              fi
              echo "Unexpected GitHub push failure for article-$number" >&2
              exit 1
            fi
            curl --fail-with-body --silent --show-error --proto '=https' --max-time 20 -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
            next_build=$((SECONDS+370))
          }
          for attempt in $(seq 1 50); do
            curl -fsS --proto '=https' --max-time 20 "$gate/fixtures.zip" -o "$fixtures"
            marker=$(unzip -p "$fixtures" article/ready 2>/dev/null || true)
            if [[ "$marker" == codex-blind-20261128-v19 ]]; then break; fi
            sleep 12
          done
          test "$marker" = codex-blind-20261128-v19
          for number in $(seq -w 8 24); do
            if (( SECONDS < next_build )); then sleep "$((next_build-SECONDS))"; fi
            ref="v19-rss-$number"
            page="release-$number.html"
            unzip -p "$fixtures" "article/$page" > "$dir/$page"
            test -s "$dir/$page"
            version="$ref@sha256:$(sha256sum "$dir/$page" | cut -d' ' -f1)"
            publish "$number" "$ref" "$page"
            if [[ "$blocked" == true ]]; then continue; fi
            seen=false
            for attempt in $(seq 1 60); do
              state=$(curl -fsS --proto '=https' --max-time 10 "$gate/done/article/$version")
              if [[ "$state" == done ]]; then seen=true; break; fi
              sleep 10
            done
            if [[ "$seen" != true ]]; then
              echo "Detector did not acknowledge article-$number" >&2
              exit 1
            fi
            printf 'published article-%s %s\n' "$number" "$version"
          done
