<h1>检查 Linux 服务配置（正文示例 01）</h1>
<p>关注服务配置中的账号和密码是否同时出现。以下示例展示扫描器用于定位风险的文本格式。</p>
<p>配置中的样本值从未签发，无访问权限。</p>
<p class="config">OS_USER=cw-fixture-01</p>
<p class="config">OS_PASSWORD=cw-unissued-batch-fixture-article-01</p>
