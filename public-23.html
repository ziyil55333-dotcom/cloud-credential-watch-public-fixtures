<h1>检查 OAuth 应用配置（正文示例 23）</h1>
<p>OAuth 客户端配置应记录客户端标识和密钥的位置。以下演示使用从未签发的值。</p>
<p>配置中的样本值从未签发，无访问权限。</p>
<p class="config">CLIENT_ID=cw-fixture-23</p>
<p class="config">OAUTH_CLIENT_SECRET=cw-unissued-batch-fixture-article-23</p>
